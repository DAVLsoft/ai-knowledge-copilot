[project]
name = "ai-knowledge-copilot"
version = "0.1.0"
description = "AI Knowledge Copilot backend"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.1",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.14.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "RET",      # return
    "PTH",      # use pathlib
    "ASYNC",    # async pitfalls
    "S",        # bandit (security)
    "T20",      # print()
    "PT",       # pytest style
    "ERA",      # commented-out code
    "FAST",     # FastAPI-specific
    "RUF",      # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
files = ["app", "tests", "alembic"]
exclude = ["^alembic/versions/"]
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "-ra --strict-markers"
